<!doctype html>
<html  lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <title>Javascript-4-變數</title>
  <link rel="stylesheet" href="css/main.css">
  <script>
    // var tall=175;
    var weight=68,tall=175,bmi;
    bmi=Math.floor(weight/((tall/100)*(tall/100)))
    alert("身高:"+tall+"公分\n體重:"+weight+"公斤\nBMI值:"+bmi)
  </script>
</head>

<body>
  <img src="images/g4.gif" alt="">
</body>
</html>
<!-- 
javaScript變數宣告
使用var 關鍵字來宣告變數 也可以同時指定預設值 javaScript屬於動態型別程式語言 所以無需指定資料型別!
  var 變數名稱=預設值
  var 變數名稱:資料型別=預設值  

  -->
