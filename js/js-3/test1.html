<!doctype html>
<html lang="zh-Hant-TW">
<head>
	<meta charset="utf-8">
	<title>Windows物件基本認識-alert+confirm+prompt</title>
	<link rel="stylesheet" href="css/s1.css">
</head>
<body>
	<script>
		let sex=prompt("請輸入性別代號(1:女生 2:男生)");
		if(sex=="1"){
			if(confirm("今天有吃過早餐嗎?")){
				alert("很棒喔!保持下去")
			}else{
				alert("身體健康很重要!!要吃啦!")
			}
		}else{
			if(confirm("看過超人電影了嗎?")){
				alert("很讚吧!!重啟的電影蠻有特色的")
			}else{
				alert("滿好看的,不暴雷!!自己買票去看!")
			}
		}
	</script>
</body>
</html>
