<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
	<meta charset="UTF-8">
	<title>綜合練習-BMI計算</title>
	<style>
		*{
			margin:0;
		}
		body{
			text-align:center;
		}
		h1{
			color:darkblue;
			font-size: 46px;
		}
		p{
			color:brown;
		}
		img{
			width:35%;
		}
	</style>

<script>
	let tall,weight,bmi,judge;
	tall=prompt("請輸入身高(公分)")
	weight=prompt("請輸入體重(公斤)")
	bmi=Math.floor(weight/Math.pow((tall/100),2));
	judge=(bmi>24)?"要留意囉!!需要減重":"多注意營養均衡!";
	alert("身高:"+tall+"公分\n體重:"+weight+"公斤\nBMI值:"+bmi+"\n建議:"+judge)
</script>
</head>
<body>
<!-- 
	請設計一個輸入視窗讓使用者輸入身高與體重 並且透過變數計算在訊息視窗中呈現BMI值
	另外判斷BMI值是否大於24 大於24或小於24都要出現建議(過重或請保持下去 -->
	<h1>BMI</h1>
	<p>健康體脂</p>
	<img src="images/p1.jpg" alt="">
</body>
</html>
