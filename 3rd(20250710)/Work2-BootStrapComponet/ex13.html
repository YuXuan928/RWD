<!doctype html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

  <title>BS-組件組合-表單</title>
</head>
<body>        

 <div class="container bg-dark text-white rounded mt-4">
   <div class="row">
     <div class="col">
       <h1>Web <span class="badge bg-danger">Survey</span></h1>
       <form action="">   
        <div class="form-group my-2"><label for="n">姓名:</label><input type="text" placeholder="請輸入姓名" required id="n" class="form-control "></div>
        <div class="form-group my-2"><label for="e">郵件:</label><input type="email" placeholder="請輸入正確格式的電子郵件" required id="e" class="form-control "></div>
        <div class="form-group my-2"><label for="t">電話:</label><input type="tel" placeholder="請輸入行動電話號碼10位數" required id="t" class="form-control "></div>
        <div class="form-group my-2"><label for="nu">數量:</label><input type="number" placeholder="請輸入購買數量" required id="nu" class="form-control "></div>

        <h3 class="my-5 mb-2">專業領域</h3>
        <div class="form-group form-check-inline"><input type="checkbox">網頁設計師</div>
        <div class="form-group form-check-inline"><input type="checkbox">平面視覺設計</div>
        <div class="form-group form-check-inline"><input type="checkbox">影音媒體剪輯</div>
        <div class="form-group form-check-inline"><input type="checkbox">電商行銷</div>

        <h3 class="my-5 mb-2">何處得知</h3>
        <div class="radio form-check-inline"><input type="radio" name="kk">新聞</div>
        <div class="radio form-check-inline"><input type="radio" name="kk">報紙</div>
        <div class="radio form-check-inline"><input type="radio" name="kk">電子傳單</div>
        <div class="radio form-check-inline"><input type="radio" name="kk">社群平台</div>
        <div class="radio form-check-inline"><input type="radio" name="kk">其他管道</div>

        <div class="form-group my-5 text-center">
          <input type="submit" value="填好送出" class="btn btn-success">
          <input type="reset" value="清除重填" class="btn btn-danger">
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Optional JavaScript; choose one of the two! -->

<!-- Option 1: Bootstrap Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>

<!-- Option 2: Separate Popper and Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js" integrity="sha384-mQ93GR66B00ZXjt0YO5KlohRA5SY2XofN4zfuZxLkoj1gXtW8ANNCe9d5Y3eG5eD" crossorigin="anonymous"></script>
-->
</body>
</html>
